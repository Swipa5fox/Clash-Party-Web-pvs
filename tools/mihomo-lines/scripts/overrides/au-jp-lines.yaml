# au-jp-lines.yaml — AU/JP 国家双口线路(纯 YAML 覆写,无 JS)
#
# 覆写 id: au-jp-lines | ext: yaml | global: true
# 取代旧的 au-two-lines / jp-two-lines 两个 JS 覆写(2026-09-20 迁移)。
#
# 语法依据(CP factory.ts → deepMerge(patch, isOverride=true)):
#   +rules        → 前置:插到订阅规则表最前(AND+IN-NAME 圈定,不污染主口 7890)
#   proxy-groups+ → 追加:挂在订阅组之后
#   listeners+    → 追加
#
# 与 JS 版的差异:
#   - 节点筛选用 mihomo 原生 include-all + filter(正则),不再硬编码节点名;
#     订阅恢复后组员自动填充,机场改名自动适应。
#   - 无「按尾部编号排序」能力(mihomo 不排序),组内顺序=订阅顺序,纯展示差异。
#   - 订阅为空时组员退化为 COMPATIBLE(DIRECT),内核不会启动失败。
#   - 广告节点过滤仍由 ad-filter(JS) 覆写负责(它按 server 回环地址判,名称筛不了)。
#
# 加新国家 = 复制一组(子组×3+入口×2+listener×2+规则×3),再开端口门
# (docker-compose.override.yml)。改完 push: node lines.mjs push overrides/au-jp-lines.yaml au-jp-lines 'AU/JP 双口线路'

# ---------- AU 子组(隐藏,入口组下拉展开) ----------
proxy-groups+:
  - name: 'AU·自动'
    type: url-test
    include-all: true
    filter: '(?i)澳洲|澳大利亚|Australia|Sydney|悉尼|🇦🇺'
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    hidden: true
  - name: 'AU·故障'
    type: fallback
    include-all: true
    filter: '(?i)澳洲|澳大利亚|Australia|Sydney|悉尼|🇦🇺'
    url: http://www.gstatic.com/generate_204
    interval: 300
    hidden: true
  - name: 'AU·手动'
    type: select
    include-all: true
    filter: '(?i)澳洲|澳大利亚|Australia|Sydney|悉尼|🇦🇺'
    proxies: [DIRECT]
    hidden: true
  # ---------- AU 入口组 ----------
  - name: 'AU·通用[17890]'
    type: select
    proxies: ['AU·自动', 'AU·故障', 'AU·手动']
  - name: 'AU·全局[17891]'
    type: select
    proxies: ['AU·自动', 'AU·故障', 'AU·手动']

  # ---------- JP 子组 ----------
  - name: 'JP·自动'
    type: url-test
    include-all: true
    filter: '(?i)日本|Japan|Tokyo|东京|大阪|🇯🇵'
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    hidden: true
  - name: 'JP·故障'
    type: fallback
    include-all: true
    filter: '(?i)日本|Japan|Tokyo|东京|大阪|🇯🇵'
    url: http://www.gstatic.com/generate_204
    interval: 300
    hidden: true
  - name: 'JP·手动'
    type: select
    include-all: true
    filter: '(?i)日本|Japan|Tokyo|东京|大阪|🇯🇵'
    proxies: [DIRECT]
    hidden: true
  # ---------- JP 入口组 ----------
  - name: 'JP·通用[8888]'
    type: select
    proxies: ['JP·自动', 'JP·故障', 'JP·手动']
  - name: 'JP·全局[8889]'
    type: select
    proxies: ['JP·自动', 'JP·故障', 'JP·手动']

# ---------- 监听口 ----------
# 全局口靠 listener.proxy 直接绑组,天然无规则;通用口靠下面 +rules 分流。
listeners+:
  - { name: au-mix, type: mixed, listen: 0.0.0.0, port: 17890, udp: true }
  - { name: au-glb, type: mixed, listen: 0.0.0.0, port: 17891, proxy: 'AU·全局[17891]', udp: true }
  - { name: jp-mix, type: mixed, listen: 0.0.0.0, port: 8888, udp: true }
  - { name: jp-glb, type: mixed, listen: 0.0.0.0, port: 8889, proxy: 'JP·全局[8889]', udp: true }

# ---------- 分流规则(前置) ----------
# 对本线路入口: 国内直连 → 剩余落本国池。AND+IN-NAME 只圈定本口,
# 主口 7890 与他国口不受影响。IN-NAME 兜底行必须排在同国 AND 行之后。
+rules:
  - AND,((IN-NAME,au-mix),(GEOSITE,cn)),DIRECT
  - AND,((IN-NAME,au-mix),(GEOIP,CN)),DIRECT
  - IN-NAME,au-mix,AU·通用[17890]
  - AND,((IN-NAME,jp-mix),(GEOSITE,cn)),DIRECT
  - AND,((IN-NAME,jp-mix),(GEOIP,CN)),DIRECT
  - IN-NAME,jp-mix,JP·通用[8888]
