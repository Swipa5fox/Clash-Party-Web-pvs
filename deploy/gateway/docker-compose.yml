# cpx-gateway v6.1 — single-port LAN build + Clash Party full Web UI.
#
# Both services run with network_mode: host (Linux): every port the party
# core listens on binds the host directly — the fixed ones (3999 Web UI,
# 7890 mixed proxy) AND custom line-group listeners added at runtime from
# the Web UI. No ports: mapping, no docker-compose.override.yml port
# bookkeeping; a new line port takes effect immediately.
#   :3999  Clash Party Web UI (complete interface: subscriptions,
#          overrides, themes — served by the party container's headless
#          Electron web mode). Token in the URL: http://<host>:3999/?token=…
#   :8080  cpx-gateway: subscription API for Clash Party clients + a thin
#          reverse proxy to the party core's controller (panel + REST + WS).
#
# The mihomo controller is seeded to 127.0.0.1:9090 by the party entrypoint:
# reachable by the gateway over localhost, NOT by LAN clients — they must go
# through the gated panel on :8080. (Volumes seeded before this change keep
# the old 0.0.0.0 value; edit it in the Web UI or recreate the volume.)
#
# Both app images are BUILT FROM SOURCE by deploy.sh, which exports
# GATEWAY_IMAGE / PARTY_IMAGE before `compose up`. Manual `docker compose up`
# falls back to the `:latest` aliases created by the same builds.
services:
  gateway:
    image: ${GATEWAY_IMAGE:-cpx-gateway:latest}
    restart: unless-stopped
    env_file: .env
    # host 模式与 ports 互斥; 8080 由 gateway 进程直接绑宿主机。
    network_mode: host
    environment:
      # 容器时区不继承主机(镜像内 /etc/localtime 是 Etc/UTC),必须显式给 TZ,
      # 否则日志时间戳比国内慢 8 小时。glibc/Node 都认这个变量。
      TZ: Asia/Shanghai
      DB_PATH: /data/gateway.db
      # mihomo external-controller on localhost (party shares the host net);
      # seeded to 127.0.0.1:9090 by the party entrypoint, invisible to the LAN.
      MIHOMO_API_URL: http://127.0.0.1:9090
    volumes:
      - gateway_data:/data
    depends_on:
      - party

  # Clash Party full Web UI + its own mihomo core (official headless web mode).
  #   Web UI  : http://<host>:3999/?token=$CP_WEB_TOKEN  (CP_WEB_TOKEN in .env)
  #   Proxy   : LAN clients use http://<host>:7890 (HTTP+SOCKS5 mixed)
  #   Lines   : custom line-group ports (Web UI 自定义线路组) bind the host
  #             directly — no compose change needed per port anymore.
  #   Config  : everything persists in the party_data volume (/data)
  # First boot seeds mihomo.yaml with allow-lan + controller 127.0.0.1:9090.
  # No `build:` section on purpose: builds are owned by deploy.sh (with the
  # NPM_REGISTRY / ELECTRON_MIRROR args). A missing image should fail loudly
  # here instead of triggering a silent no-args build that pulls from
  # registry.npmjs.org + github.com.
  party:
    image: ${PARTY_IMAGE:-cpx-party:latest}
    restart: unless-stopped
    # tini as PID 1: xvfb-run relies on SIGUSR1 from Xvfb, which shells cannot
    # receive when they are PID 1 (docker-init forwards signals + reaps).
    init: true
    # host 模式: 所有端口直接绑宿主机, 任意新增线路口即写即生效。仅 Linux
    # 宿主可用(Docker Desktop 不支持)。注意: 旧的 docker-compose.override.yml
    # 里若残留 ports 段会与 host 模式冲突报错, 需一并删除。
    network_mode: host
    # 健康检查: Web UI 是否真的应答(不带 token,和 deploy.sh 探活走同一条路径)。
    #   1) 镜像里没有 curl/wget,只有 node(v22 自带全局 fetch),所以只能用 node -e。
    #      若写成 curl -f,探针会永久失败 → 有执行者时就是重启循环。
    #   2) 超时必须写在 node 内部(AbortSignal),否则探针被 Docker 的 timeout 强杀,
    #      下面的 `|| kill 1` 永远等不到执行机会。
    #   3) `|| kill 1`: Docker 只在【进程退出】时套用 restart 策略,把容器标成
    #      unhealthy 并不会重启它。所以这里连挂 3 次(≈90s 完全不应答)后杀掉
    #      PID 1(tini),让上面的 unless-stopped 把它重新拉起 —— 这才是"自己会好"
    #      的那一半。只想看状态、不想自动重启: 去掉 " || kill 1" 即可。
    # 已核实重启是安全的: 覆写/订阅/端口门都在 party_data 卷里,重启后自动生效。
    healthcheck:
      test:
        - CMD-SHELL
        - >
          node -e "fetch('http://127.0.0.1:${PARTY_WEB_PORT:-3999}/',{signal:AbortSignal.timeout(8000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" || kill 1
      interval: 30s
      timeout: 12s
      retries: 3
      start_period: 60s
    environment:
      # 同上: 容器时区需显式指定,否则 Web UI / 日志时间戳为 UTC。
      TZ: Asia/Shanghai
      CP_WEB_TOKEN: ${CP_WEB_TOKEN:?Set CP_WEB_TOKEN in .env (see .env.example)}
      # host 模式下这就是应用真实监听端口(bridge 时代只是宿主侧映射); 改动后
      # docker compose up -d party 生效。
      CP_WEB_PORT: ${PARTY_WEB_PORT:-3999}
    volumes:
      - party_data:/data

volumes:
  gateway_data:
  party_data:
