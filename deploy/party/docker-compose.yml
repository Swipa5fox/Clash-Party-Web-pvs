# clash-party v1.3+ — 纯 Node Web UI + mihomo sidecar 单容器。
# 这是对 192.168.110.53 实跑形态（/opt/clash-party + bind /var/lib/clash-party）
# 的仓库化：同端口、同数据目录语义，不依赖 gateway 即可独立部署。
#
#   Web UI  : http://<host>:3999/ （账号密码登录，初始凭据见 deploy.sh 部署汇总）
#   Proxy   : LAN 设备 http://<host>:7890 (HTTP+SOCKS5 mixed)
#   Lines   : 自定义线路组端口（Web UI 添加）在 host 模式下直接绑宿主机，即写即生效
#   Config  : 一切持久化在 /data
#
# 镜像须先手工构建（context 是仓库根）：
#   docker build -t clash-party:latest -f deploy/party/Dockerfile .
# 无 build: 段是刻意的（与 gateway compose 同一 doctrine）：缺镜像就响亮失败，
# 静默构建会绕过 NPM_REGISTRY/GITHUB_MIRROR 走 npmjs+github 直连。
# network_mode: host 仅 Linux 宿主可用（Docker Desktop 不支持）。
services:
  clash-party:
    image: clash-party:latest
    restart: unless-stopped
    # tini 转发信号 + 收割 mihomo sidecar 子进程（node 不是完美的 PID 1）。
    init: true
    network_mode: host
    environment:
      TZ: Asia/Shanghai
    volumes:
      # bind 或命名卷均可；bind 到宿主路径便于备份与直查（53 实跑用法）。
      - /var/lib/clash-party:/data
