name: Build
on:
  # 发布为本机手工流程；CI 仅 workflow_dispatch 出 dev 构建产物
  workflow_dispatch:

permissions: write-all

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install
      - name: Update Version for Dev Build
        env:
          GITHUB_EVENT_NAME: workflow_dispatch
        run: node scripts/update-version.mjs
      - name: Prepare (mihomo sidecar + geo files)
        run: pnpm prepare --x64
      - name: Build
        run: pnpm build:tarball
      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Linux x64 tarball
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
