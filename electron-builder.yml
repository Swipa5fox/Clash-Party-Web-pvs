appId: party.mihomo.app
productName: Clash Party
directories:
  buildResources: deploy/build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!images/*'
  - '!scripts/*'
  - '!extra/*'
  - '!tailwind.config.js'
  - '!postcss.config.js'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # 本地/CI 构建产物绝不入包
  - '!dist/*'
  - '!release/*'
extraResources:
  - from: './extra/'
    to: ''
# Web-Only：无窗口后台服务，不注册 URI 协议 / .cpx 文件关联 / 桌面快捷方式
win:
  target:
    - nsis
    - 7z
  artifactName: clash-party-windows-${version}-${arch}-portable.${ext}
nsis:
  artifactName: clash-party-windows-${version}-${arch}-setup.${ext}
  uninstallDisplayName: ${productName}
  allowToChangeInstallationDirectory: true
  oneClick: false
  perMachine: true
  createDesktopShortcut: false
  createStartMenuShortcut: false
npmRebuild: true
publish: []
